# SonarQube / SonarCloud project definition
# For SonarCloud set sonar.organization and sonar.projectKey to the values
# shown in your SonarCloud project (usually <github-org>_<repo-name>).
sonar.projectKey=post-ci
sonar.projectName=post-ci

sonar.sources=server/src,client/src
sonar.exclusions=server/src/tests/**,**/node_modules/**,**/dist/**,**/uploads/**
sonar.tests=server/src/tests
sonar.test.inclusions=server/src/tests/**

sonar.sourceEncoding=UTF-8
