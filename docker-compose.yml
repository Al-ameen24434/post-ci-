
services:
  db:
    image: postgres:16-alpine
    container_name: postapi-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postapi
    # No host ports: only reachable by other services on this compose network.
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postapi
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    # Internal only - reached through nginx (client) at /api and /uploads.
    expose:
      - "4000"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      # VITE_API_URL defaults to "" in Dockerfile so the browser uses relative
      # /api (proxied by nginx to server:4000). To build with an absolute URL:
      #   docker compose build --build-arg VITE_API_URL=http://localhost:4000 client
    depends_on:
      - server
    # The single public endpoint: frontend + /api + /uploads on one port.
    ports:
      - "${APP_PORT:-8080}:80"
volumes:
  pg-data:
