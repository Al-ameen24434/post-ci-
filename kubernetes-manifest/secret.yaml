apiVersion: v1
kind: Secret
metadata:
  name: post-api-secret
  namespace: post-api
type: Opaque
stringData:
  # Generate a strong password/secret before production use.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postapi
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postapi
  JWT_SECRET: dev-secret-change-me
